<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>لوحة التحكم | حيالة القصيم</title>
<link rel="icon" href="../assets/logo.png">
<link rel="stylesheet" href="../assets/style.css">
<style>
  .mg{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-start}
  .mu{display:flex;align-items:center;gap:12px;width:100%;flex-wrap:wrap}
  .mu .ms{font-size:14px;color:#64748b}
  .mc{width:160px;border:1px solid #d9e2ec;border-radius:10px;overflow:hidden;background:#fff;position:relative}
  .mc img{width:100%;height:115px;object-fit:cover;display:block;background:#eef2f6}
  .mb{position:absolute;top:6px;inset-inline-start:6px;background:#fbbf24;color:#0f3d6e;font-size:12px;font-weight:700;padding:2px 10px;border-radius:999px}
  .mt{display:flex;flex-wrap:wrap;gap:4px;padding:6px}
  .mt button{flex:1 1 auto;font:inherit;font-size:12px;padding:5px 6px;border:1px solid #cbd5e1;border-radius:6px;background:#f8fafc;cursor:pointer}
  .mt button.d{color:#b91c1c;border-color:#fca5a5}
  .mh{font-size:13px;color:#64748b;width:100%;margin:0}
  .dz-note{background:#eaf6fd;border:1px solid #bfe3f6;color:#0f3d6e;border-radius:12px;padding:12px 16px;margin-bottom:16px;font-weight:700;display:flex;gap:12px;flex-wrap:wrap;align-items:center;justify-content:space-between}
  .dz{border:2px dashed #b7d6ea;border-radius:18px;overflow:hidden;background:#fff}
  .dz .hero,.dz .card,.dz .city-card,.dz .owner-banner{position:relative}
  .dz .hero{padding-bottom:50px}
  .dz .card{cursor:default}
  .dz .card:hover{transform:none}
  .slot-btn{position:absolute;z-index:6;inset-inline-start:10px;top:10px;display:flex;gap:6px;align-items:center;background:rgba(255,255,255,.96);color:#14487F;border:0;border-radius:999px;padding:7px 14px;font:inherit;font-weight:700;font-size:13px;cursor:pointer;box-shadow:0 2px 10px rgba(0,0,0,.28)}
  .slot-btn:hover{background:#F9B91E}
  .slot-btn .i{width:16px;height:16px}
  .md{position:fixed;inset:0;background:rgba(10,30,55,.55);display:grid;place-items:center;z-index:200;padding:16px}
  .md[hidden]{display:none}
  .md-box{background:#fff;border-radius:18px;padding:20px;width:min(480px,100%);max-height:90vh;overflow:auto}
  .md-box h3{color:#14487F;margin-bottom:6px}
  .md-pv{margin:10px 0;border-radius:12px;overflow:hidden;background:#eef2f6;min-height:90px;display:grid;place-items:center;color:#64748b}
  .md-pv img{width:100%;max-height:260px;object-fit:cover;display:block}
</style>
<script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4"></script>
<script defer src="../assets/supabase.js"></script>
<script defer src="../assets/app.js"></script>
</head>
<body data-hold>
<main id="main"><section class="section"><div class="container">
  <h1 class="page-title">لوحة التحكم</h1>
  <div id="login" style="max-width:420px" hidden>
    <div class="field"><label for="em">البريد الإلكتروني</label><input id="em" type="email" dir="ltr" autocomplete="username"></div>
    <div class="field"><label for="pw">كلمة المرور</label><input id="pw" type="password" dir="ltr" autocomplete="current-password"><span class="err" id="lerr"></span></div>
    <button class="btn btn-navy btn-block" id="go">تسجيل الدخول</button>
  </div>
  <div id="app" hidden>
    <div class="adm-bar"><div class="adm-tabs" id="tabs"></div><button class="btn btn-line btn-sm" id="out">تسجيل الخروج</button></div>
    <div id="list"></div>
    <div id="fm" hidden></div>
    <div id="dz" hidden></div>
  </div>
  <div class="md" id="md" hidden role="dialog" aria-modal="true" aria-labelledby="md-h">
    <div class="md-box">
      <h3 id="md-h"></h3>
      <div class="md-pv" id="md-pv"></div>
      <div class="mu"><label class="btn btn-yellow btn-sm" style="cursor:pointer">رفع صورة من جهازك<input type="file" id="md-f" accept="image/*" hidden></label><span class="ms" id="md-s"></span></div>
      <div id="md-txt" style="margin-top:12px"><div class="field"><label for="md-t1">العنوان (يظهر تحت الصورة)</label><input id="md-t1" maxlength="80"></div><div class="field"><label for="md-t2">وصف قصير</label><input id="md-t2" maxlength="120"></div></div>
      <p class="err" id="md-e" role="alert"></p>
      <div class="nav-btns"><button class="btn btn-line" type="button" id="md-x">إلغاء</button><button class="btn btn-line" type="button" id="md-rm"></button><button class="btn btn-yellow" type="button" id="md-ok" style="margin-inline-start:auto">حفظ</button></div>
    </div>
  </div>
</div></section></main>
<script>
document.addEventListener('DOMContentLoaded', async () => {
  const $ = id => document.getElementById(id), E = H.esc;
  const ST = { new: 'جديد', contacted: 'تم التواصل', confirmed: 'مؤكد', declined: 'مرفوض', cancelled: 'ملغي' };
  const dt = v => v ? new Date(v).toLocaleDateString('ar-SA') : '';
  const yn = v => v ? 'نعم' : 'لا';
  const stay = v => v === 'overnight' ? 'مبيت' : 'بدون مبيت';
  const thumb = v => v ? `<img src="${E(v)}" alt="" style="width:64px;height:48px;object-fit:cover;border-radius:8px">` : '';
  const BUCKET = 'property-images';
  let units = [], cur = 'design', rows = [], dz = { units: [], photos: {}, st: {} }, md = null;
  let media = {}, mOrig = {}, mUp = [], mFolder = '', busy = 0; // حالة الصور داخل النموذج المفتوح (الحالية / الأصلية / المرفوعة في هذه الجلسة)
  // حقول النموذج: [مفتاح, عنوان, نوع(t نص/n رقم/a نص طويل/l أسطر/c اختيار/s قائمة/p صور متعددة/i صورة واحدة), إلزامي, خيارات]
  const slotLabel = v => !v ? 'المعرض فقط' : (v.startsWith('featured') ? 'من أجمل لقطاتنا' : 'أحدث الصور') + ' #' + v.split('-')[1];
  const ENT = {
    design: { t: 'تصميم الموقع', design: true },
    booking_requests: { t: 'طلبات الحجز',
      cols: [['unit_name', 'الوحدة'], ['guest_name', 'الاسم'], ['phone', 'الجوال'], ['stay_type', 'النوع', stay], ['check_in', 'من'], ['check_out', 'إلى'], ['guests', 'الأشخاص'], ['notes', 'ملاحظات'], ['status', 'الحالة', v => ST[v] || v], ['created_at', 'التاريخ', dt]],
      acts: r => [['wa', 'واتساب'], r.status === 'new' && ['st:contacted', 'تم التواصل'], r.status !== 'confirmed' && ['st:confirmed', 'تأكيد', 'btn-navy'], (r.status === 'new' || r.status === 'contacted') && ['st:declined', 'رفض'], r.status === 'confirmed' && ['st:cancelled', 'إلغاء التأكيد']].filter(Boolean) },
    units: { t: 'الوحدات', nodel: true, order: 'sort', asc: true,
      cols: [['name', 'الوحدة'], ['capacity', 'السعة'], ['price_overnight_from', 'مبيت من'], ['price_dayuse_from', 'بدون مبيت من'], ['bookable', 'متاحة للحجز', yn], ['active', 'ظاهرة', yn]],
      form: [['name', 'اسم الوحدة', 't', 1], ['capacity', 'السعة (عدد الأشخاص)', 'n'], ['rooms', 'عدد الغرف', 'n'], ['price_overnight_from', 'السعر يبدأ من - مبيت', 'n'], ['price_dayuse_from', 'السعر يبدأ من - بدون مبيت', 'n'], ['bookable', 'متاحة للحجز', 'c'], ['active', 'تظهر في الموقع', 'c'], ['sort', 'الترتيب', 'n'], ['amenities', 'المميزات (كل سطر ميزة)', 'l'], ['images', 'صور الوحدة', 'p'], ['description', 'الوصف', 'a']] },
    gallery_photos: { t: 'معرض الصور', add: true, bulk: true,
      cols: [['image', 'الصورة', thumb, 1], ['title', 'العنوان'], ['subtitle', 'الوصف'], ['slot', 'مكانها في الصفحة الرئيسية', slotLabel], ['sort', 'الترتيب']],
      form: [['image', 'الصورة', 'i', 1], ['title', 'العنوان (يظهر تحت الصورة)', 't'], ['subtitle', 'وصف قصير', 't'], ['unit_id', 'الوحدة المرتبطة (اختياري)', 's', 0, 'units'], ['sort', 'الترتيب', 'n']] },
    posts: { t: 'المقالات', add: true,
      cols: [['title', 'العنوان'], ['slug', 'الرابط'], ['published', 'منشور', yn], ['created_at', 'التاريخ', dt]],
      form: [['title', 'العنوان', 't', 1], ['slug', 'الرابط (إنجليزي بدون مسافات)', 't', 1], ['excerpt', 'مقتطف', 't'], ['cover', 'صورة الغلاف', 'i'], ['body', 'النص (سطر فاضي بين الفقرات)', 'a'], ['published', 'منشور', 'c']] },
    suggestions: { t: 'الاقتراحات', cols: [['name', 'الاسم'], ['phone', 'الجوال'], ['message', 'الاقتراح'], ['created_at', 'التاريخ', dt]] }
  };
  const msg = (el, t) => { el.innerHTML = `<p class="empty">${t}</p>`; };

  // ===== الصور: تصغير تلقائي ثم رفع =====
  async function shrink(file) {
    const bmp = await createImageBitmap(file);
    const max = 1600, s = Math.min(1, max / Math.max(bmp.width, bmp.height));
    const c = document.createElement('canvas');
    c.width = Math.round(bmp.width * s); c.height = Math.round(bmp.height * s);
    const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height);
    g.drawImage(bmp, 0, 0, c.width, c.height);
    if (bmp.close) bmp.close();
    return await new Promise((res, rej) => c.toBlob(b => b ? res(b) : rej(new Error('تعذّر تجهيز الصورة')), 'image/jpeg', 0.85));
  }
  async function uploadImg(file) {
    const blob = await shrink(file);
    const path = `${mFolder}/${Date.now()}-${Math.random().toString(36).slice(2, 8)}.jpg`;
    const { error } = await sb.storage.from(BUCKET).upload(path, blob, { contentType: 'image/jpeg', cacheControl: '31536000' });
    if (error) throw error;
    return sb.storage.from(BUCKET).getPublicUrl(path).data.publicUrl;
  }
  // حذف الملفات من التخزين (روابط مجلدنا فقط، وأي رابط خارجي يتم تجاهله)
  function purge(urls) {
    const re = new RegExp('/storage/v1/object/public/' + BUCKET + '/(.+)$');
    const paths = [...new Set(urls)].map(u => { const m = re.exec(u || ''); return m ? decodeURIComponent(m[1]) : null; }).filter(Boolean);
    if (!paths.length) return;
    sb.storage.from(BUCKET).remove(paths).then(({ error }) => { if (error) console.error(error); });
  }
  function discard() { if (mUp.length) purge(mUp); mUp = []; } // صور اتر فعت ولم تُحفظ
  function renderMedia(k) {
    const box = $('m-' + k), t = box.dataset.t, v = media[k];
    const multi = t === 'p', list = multi ? v : (v ? [v] : []);
    const cards = list.map((u, i) => `<div class="mc"><img src="${E(u)}" alt="">
      ${multi && i === 0 ? '<span class="mb">الغلاف</span>' : ''}
      <div class="mt">
        ${multi && i > 0 ? `<button type="button" data-m="cover" data-i="${i}">جعلها الغلاف</button>` : ''}
        ${multi && i > 0 ? `<button type="button" data-m="up" data-i="${i}">تقديم</button>` : ''}
        ${multi && i < list.length - 1 ? `<button type="button" data-m="down" data-i="${i}">تأخير</button>` : ''}
        <button type="button" class="d" data-m="del" data-i="${i}">حذف</button>
      </div></div>`).join('');
    box.innerHTML = `<div class="mu">
        <label class="btn btn-yellow btn-sm" style="cursor:pointer">${multi ? 'رفع صور من جهازك' : (v ? 'تغيير الصورة' : 'رفع صورة من جهازك')}<input type="file" accept="image/*" ${multi ? 'multiple' : ''} hidden></label>
        <span class="ms" id="s-${k}"></span>
      </div>
      ${multi && list.length ? '<p class="mh">أول صورة هي الغلاف الذي يظهر في القوائم. استخدم الأزرار لترتيب الصور.</p>' : ''}
      ${cards}`;
  }
  async function onMediaChange(k, input) {
    const files = [...input.files]; if (!files.length) return;
    const t = $('m-' + k).dataset.t, st = $('s-' + k);
    busy++; let ok = 0;
    for (let n = 0; n < files.length; n++) {
      st.textContent = `جاري رفع الصورة ${n + 1} من ${files.length}...`;
      try {
        const url = await uploadImg(files[n]);
        mUp.push(url);
        if (t === 'p') media[k].push(url); else media[k] = url;
        ok++;
      } catch (e) { console.error(e); H.toast('تعذّر رفع صورة: ' + (e.message || '')); }
    }
    busy--; renderMedia(k);
    if (ok) H.toast(ok > 1 ? `تم رفع ${ok} صور` : 'تم رفع الصورة');
  }
  function onMediaClick(k, b) {
    const a = b.dataset.m, i = +b.dataset.i, t = $('m-' + k).dataset.t;
    if (t === 'i') { media[k] = ''; return renderMedia(k); }
    const arr = media[k];
    if (a === 'del') arr.splice(i, 1);
    else if (a === 'cover') arr.unshift(arr.splice(i, 1)[0]);
    else if (a === 'up' && i > 0) [arr[i - 1], arr[i]] = [arr[i], arr[i - 1]];
    else if (a === 'down' && i < arr.length - 1) [arr[i + 1], arr[i]] = [arr[i], arr[i + 1]];
    renderMedia(k);
  }

  // ===== تصميم الموقع: عرض الصفحة الرئيسية بنفس شكلها، والضغط على أي مكان صورة لتغييره =====
  async function designLoad() {
    msg($('dz'), 'جاري التحميل...');
    const [u, g, st] = await Promise.all([sb.from('units').select('*').order('sort'), sb.from('gallery_photos').select('*').not('slot', 'is', null), sb.from('site_settings').select('key,value')]);
    if (u.error || g.error || st.error) { console.error(u.error || g.error || st.error); return msg($('dz'), 'تعذّر التحميل'); }
    dz = { units: u.data || [], photos: {}, st: {} };
    (g.data || []).forEach(r => { dz.photos[r.slot] = r; });
    (st.data || []).forEach(r => { dz.st[r.key] = r.value; });
    designRender();
  }
  function designRender() {
    const cssUrl = u => E(String(u).replace(/['"()\\\s]/g, c => '%' + c.charCodeAt(0).toString(16)));
    const sbtn = (type, key, label) => `<button type="button" class="slot-btn" data-s="${type}" data-k="${E(key)}">${H.icon('plus')}${label}</button>`;
    const photo = slot => {
      const r = dz.photos[slot];
      const body = r ? ((r.title || r.subtitle) ? `<div class="card-body">${r.title ? `<h3>${E(r.title)}</h3>` : ''}${r.subtitle ? `<div class="card-sub">${E(r.subtitle)}</div>` : ''}</div>` : '') : '<div class="card-body"><h3>صور المنتجع قريبًا</h3></div>';
      return `<div class="card">${sbtn('photo', slot, r ? 'تغيير الصورة' : 'إضافة صورة')}<div class="card-img${r ? '' : ' ph'}">${r ? `<img src="${E(r.image)}" alt="">` : H.icon('home')}</div>${body}</div>`;
    };
    const hero = dz.st.hero_image || '../assets/hero.webp', cta = dz.st.cta_image || '../assets/hero.webp';
    $('dz').innerHTML = `
      <div class="dz-note"><span>هذا شكل الصفحة الرئيسية كما يراها الزائر. اضغط على أي زر <b>"إضافة / تغيير الصورة"</b> لوضع صورتك في مكانها.</span><a class="btn btn-line btn-sm" href="../index.html" target="_blank" rel="noopener">فتح الموقع</a></div>
      <div class="dz">
        <section class="hero">
          <div class="hero-bg"><img src="${E(hero)}" alt=""></div>${sbtn('hero', 'hero', 'تغيير صورة الواجهة')}
          <div class="container">
            <span class="hero-eyebrow">شاليهات ومزرعة في القصيم</span>
            <h1>إجازتك المثالية في <em>حيالة القصيم</em> على بُعد ضغطة</h1>
            <p class="lead">شاليهات ومزرعة للإيجار، مبيت أو بدون مبيت. اختر وحدتك وأرسل طلب الحجز ونؤكده معك.</p>
            <div class="search-box" inert aria-hidden="true"><label class="sf"><span>الوحدة</span><select><option>اختر الوحدة</option></select></label><label class="sf"><span>نوع الإقامة</span><select><option>مبيت</option></select></label><label class="sf"><span>تاريخ الوصول</span><input type="date"></label><button class="btn btn-yellow btn-lg" type="button">تحقّق من التوفر</button></div>
          </div>
        </section>
        <section class="section"><div class="container">
          <div class="section-head"><div><h2>وحداتنا</h2><p>صورة كل وحدة تظهر هنا (الصورة الأولى للوحدة)</p></div></div>
          <div class="cities">${dz.units.map(u => { const im = (u.images || [])[0]; return `<div class="city-card">${im ? `<img src="${E(im)}" alt="">` : ''}<div class="ct"><strong>${E(u.name)}</strong><span>${u.kind === 'farm' ? 'مزرعة' : 'شاليه'}${u.bookable ? '' : ' · غير متاح'}</span></div>${sbtn('unit', u.id, im ? 'تغيير صورة الوحدة' : 'إضافة صورة')}</div>`; }).join('')}</div>
        </div></section>
        <section class="section" style="padding-top:0"><div class="container">
          <div class="section-head"><div><h2>من أجمل لقطاتنا</h2><p>لقطات مختارة من المنتجع</p></div></div>
          <div class="grid">${[1, 2, 3, 4].map(i => photo('featured-' + i)).join('')}</div>
        </div></section>
        <section class="section" style="padding-top:0"><div class="container">
          <div class="section-head"><div><h2>أحدث الصور</h2><p>آخر ما أُضيف إلى المعرض</p></div></div>
          <div class="grid">${[1, 2, 3, 4, 5, 6, 7, 8].map(i => photo('latest-' + i)).join('')}</div>
        </div></section>
        <section class="section" style="padding-top:0"><div class="container">
          <div class="owner-banner" style="background-image:url('${cssUrl(cta)}')">${sbtn('cta', 'cta', 'تغيير صورة البانر')}
            <div class="in"><h2>جاهز لإجازتك؟</h2><p>اختر وحدتك وأرسل طلب الحجز الآن، ونؤكده معك عبر واتساب</p>
              <ul><li>مبيت أو بدون مبيت حسب رغبتك</li><li>تقويم يوضح الأيام المتاحة</li><li>تأكيد مباشر من الفريق عبر واتساب</li></ul>
              <a class="btn btn-yellow btn-lg">اطلب حجزك الآن</a></div>
          </div>
        </div></section>
      </div>`;
  }
  function mdPreview() {
    const m = md, def = m.def && !m.url;
    $('md-pv').innerHTML = (m.url || def) ? `<img src="${E(m.url || '../assets/hero.webp')}" alt="">` : 'لا توجد صورة في هذا المكان';
    $('md-rm').textContent = m.type === 'photo' ? 'إزالة من هذا المكان' : m.def ? 'العودة للصورة الافتراضية' : 'إزالة صورة الوحدة';
    $('md-rm').hidden = !m.url;
  }
  function openSlot(type, key) {
    let url = '', t1 = '', t2 = '', head = '';
    if (type === 'hero' || type === 'cta') { url = dz.st[type === 'hero' ? 'hero_image' : 'cta_image'] || ''; head = type === 'hero' ? 'صورة الواجهة الرئيسية' : 'صورة بانر الحجز'; mFolder = 'site'; }
    else if (type === 'unit') { const u = dz.units.find(x => x.id === key); url = (u.images || [])[0] || ''; head = 'صورة ' + u.name; mFolder = 'units'; }
    else { const r = dz.photos[key]; url = r ? r.image : ''; t1 = r && r.title || ''; t2 = r && r.subtitle || ''; head = `${key.startsWith('featured') ? 'من أجمل لقطاتنا' : 'أحدث الصور'} - صورة رقم ${key.split('-')[1]}`; mFolder = 'gallery_photos'; }
    md = { type, key, url, orig: url, up: [], def: type === 'hero' || type === 'cta' };
    $('md-h').textContent = head; $('md-t1').value = t1; $('md-t2').value = t2; $('md-txt').hidden = type !== 'photo';
    $('md-e').textContent = ''; $('md-s').textContent = ''; $('md-ok').disabled = false;
    mdPreview(); $('md').hidden = false; $('md-f').focus();
  }
  function closeMd(discardUploads) {
    if (discardUploads && md && md.up.length) purge(md.up);
    md = null; $('md').hidden = true;
  }
  async function mdSave() {
    if (busy) return H.toast('انتظر حتى ينتهي رفع الصورة');
    const m = md; $('md-ok').disabled = true; let err = null;
    try {
      if (m.type === 'hero' || m.type === 'cta') {
        const k = m.type === 'hero' ? 'hero_image' : 'cta_image';
        err = m.url ? (await sb.from('site_settings').upsert({ key: k, value: m.url })).error : (await sb.from('site_settings').delete().eq('key', k)).error;
      } else if (m.type === 'unit') {
        const u = dz.units.find(x => x.id === m.key), rest = (u.images || []).slice(1);
        err = (await sb.from('units').update({ images: m.url ? [m.url, ...rest] : rest }).eq('id', u.id)).error;
      } else {
        const ex = dz.photos[m.key], title = $('md-t1').value.trim() || null, subtitle = $('md-t2').value.trim() || null;
        if (m.url) err = (ex ? await sb.from('gallery_photos').update({ image: m.url, title, subtitle }).eq('id', ex.id) : await sb.from('gallery_photos').insert({ slot: m.key, image: m.url, title, subtitle })).error;
        else if (ex) err = (await sb.from('gallery_photos').update({ slot: null }).eq('id', ex.id)).error;
      }
    } catch (e) { err = e; }
    $('md-ok').disabled = false;
    if (err) { console.error(err); $('md-e').textContent = 'تعذّر الحفظ: ' + (err.message || ''); return; }
    const drop = m.up.filter(u => u !== m.url);
    if (m.orig && m.orig !== m.url && !(m.type === 'photo' && !m.url)) drop.push(m.orig); // إزالة صورة من مكانها لا تحذف الملف (يبقى في المعرض)
    purge(drop); closeMd(false); H.toast('تم الحفظ', 'ok'); designLoad();
  }
  $('dz').addEventListener('click', e => { const b = e.target.closest('.slot-btn'); if (b) openSlot(b.dataset.s, b.dataset.k); });
  $('md-x').addEventListener('click', () => closeMd(true));
  $('md').addEventListener('click', e => { if (e.target.id === 'md') closeMd(true); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && md) closeMd(true); });
  $('md-rm').addEventListener('click', () => { md.url = ''; mdPreview(); });
  $('md-ok').addEventListener('click', mdSave);
  $('md-f').addEventListener('change', async e => {
    const f = e.target.files[0]; if (!f || !md) return;
    busy++; $('md-s').textContent = 'جاري الرفع...'; $('md-e').textContent = '';
    try { const url = await uploadImg(f); md.up.push(url); md.url = url; mdPreview(); }
    catch (er) { console.error(er); $('md-e').textContent = 'تعذّر رفع الصورة، جرّب صورة أخرى'; }
    busy--; $('md-s').textContent = ''; e.target.value = '';
  });
  async function bulkUpload(input) {
    const files = [...input.files]; if (!files.length) return;
    mFolder = 'gallery_photos'; const st = $('bulk-s'); let ok = 0;
    for (let n = 0; n < files.length; n++) {
      st.textContent = `جاري رفع ${n + 1} من ${files.length}...`;
      try {
        const url = await uploadImg(files[n]);
        const { error } = await sb.from('gallery_photos').insert({ image: url });
        if (error) { purge([url]); throw error; }
        ok++;
      } catch (e) { console.error(e); H.toast('تعذّر رفع صورة: ' + (e.message || '')); }
    }
    input.value = ''; H.toast(`تم رفع ${ok} من ${files.length}`, ok ? 'ok' : ''); load();
  }
  async function badge() {
    const { count } = await sb.from('booking_requests').select('id', { count: 'exact', head: true }).eq('status', 'new');
    const b = document.querySelector('#tabs button[data-k="booking_requests"]');
    if (b) b.textContent = `${ENT.booking_requests.t}${count ? ` (${count})` : ''}`;
  }
  async function enter() {
    const { data: { session } } = await sb.auth.getSession();
    if (!session) { $('app').hidden = true; $('login').hidden = false; return; }
    const { data: a } = await sb.from('admins').select('user_id').maybeSingle();
    $('login').hidden = !!a;
    if (!a) { $('lerr').textContent = 'هذا الحساب ليس أدمن. أضفه لجدول admins ثم أعد الدخول.'; await sb.auth.signOut(); $('login').hidden = false; return; }
    $('app').hidden = false;
    const c = await sb.from('units').select('id,name').order('sort'); units = c.data || [];
    $('tabs').innerHTML = Object.keys(ENT).map(k => `<button data-k="${k}">${ENT[k].t}</button>`).join('');
    show(cur); badge();
  }
  function show(k) {
    discard();
    const d = !!ENT[k].design;
    cur = k; $('fm').hidden = true; $('dz').hidden = !d; $('list').hidden = d;
    document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('on', b.dataset.k === k));
    if (d) designLoad(); else load();
  }
  async function load() {
    const e = ENT[cur]; msg($('list'), 'جاري التحميل...');
    const { data, error } = await sb.from(cur).select(e.sel || '*').order(e.order || 'created_at', { ascending: !!e.asc });
    if (error) { console.error(error); return msg($('list'), 'تعذّر التحميل'); }
    rows = data || [];
    const btn = (a, i, t, c) => `<button class="btn ${c || 'btn-line'} btn-sm" data-a="${a}" data-i="${i}">${t}</button>`;
    const th = e.cols.map(c => `<th>${c[1]}</th>`).join('') + '<th></th>';
    const tr = rows.map((r, i) => `<tr>${e.cols.map(c => `<td>${c[3] ? c[2](r[c[0]], r) : E(c[2] ? c[2](r[c[0]], r) : r[c[0]])}</td>`).join('')}<td class="acts">
      ${(e.acts ? e.acts(r) : []).map(([a, t, c]) => btn(a, i, t, c)).join('')}${e.form ? btn('edit', i, 'تعديل') : ''}${e.nodel ? '' : btn('del', i, 'حذف')}</td></tr>`).join('');
    $('list').innerHTML = `${e.add ? `<p><button class="btn btn-yellow btn-sm" data-a="new">إضافة جديد</button>${e.bulk ? ` <label class="btn btn-navy btn-sm" style="cursor:pointer;margin-inline-start:8px">رفع عدة صور دفعة واحدة<input type="file" id="bulk" accept="image/*" multiple hidden></label> <span class="ms" id="bulk-s" style="color:#64748b;font-size:14px"></span>` : ''}</p>` : ''}
      <p class="result-count">${rows.length} سجل</p>
      ${rows.length ? `<div class="tbl-wrap"><table class="adm"><thead><tr>${th}</tr></thead><tbody>${tr}</tbody></table></div>` : '<p class="empty">لا توجد بيانات</p>'}`;
  }
  async function upd(id, patch) {
    const { error } = await sb.from(cur).update(patch).eq('id', id);
    if (error) { console.error(error); return H.toast('تعذّر التنفيذ'); }
    H.toast('تم'); load();
  }
  function form(row, fields, table) {
    const v = row || {};
    media = {}; mOrig = {}; mUp = []; mFolder = table; busy = 0;
    $('fm').innerHTML = `<div class="form-grid">${fields.map(([k, l, t, req, o]) => {
      let x = v[k];
      if (t === 'l') x = Array.isArray(x) ? x.join('\n') : '';
      if (t === 'p' || t === 'i') {
        media[k] = t === 'p' ? (Array.isArray(x) ? x.slice() : []) : (x || '');
        mOrig[k] = t === 'p' ? media[k].slice() : media[k];
        return `<div class="field full"><label>${l}${req ? ' *' : ''}</label><div class="mg" id="m-${k}" data-t="${t}"></div></div>`;
      }
      const lab = `<label for="f-${k}">${l}${req ? ' *' : ''}</label>`;
      let inp;
      if (t === 'a') inp = `<textarea id="f-${k}" rows="6">${E(x)}</textarea>`;
      else if (t === 'l') inp = `<textarea id="f-${k}" rows="4" dir="ltr">${E(x)}</textarea>`;
      else if (t === 'c') return `<div class="field"><label><input type="checkbox" id="f-${k}" ${x ? 'checked' : ''}> ${l}</label></div>`;
      else if (t === 's') { const opts = o === 'units' ? units.map(c => [c.id, c.name]) : o.map(s => [s, ST[s] || s]); inp = `<select id="f-${k}"><option value="">-</option>${opts.map(([a, b]) => `<option value="${E(a)}" ${a === x ? 'selected' : ''}>${E(b)}</option>`).join('')}</select>`; }
      else inp = `<input id="f-${k}" type="${t === 'n' ? 'number' : 'text'}" value="${E(x)}" ${t === 'n' ? 'step="any"' : ''}>`;
      return `<div class="field${t === 'a' || t === 'l' ? ' full' : ''}">${lab}${inp}</div>`;
    }).join('')}</div>
    <div class="nav-btns"><button class="btn btn-line" id="fc">إلغاء</button><button class="btn btn-yellow" id="fs" style="margin-inline-start:auto">حفظ</button></div>`;
    $('list').hidden = true; $('fm').hidden = false; window.scrollTo({ top: 0 });
    for (const [k, , t] of fields) {
      if (t !== 'p' && t !== 'i') continue;
      renderMedia(k);
      const box = $('m-' + k);
      box.addEventListener('change', e => { if (e.target.type === 'file') { onMediaChange(k, e.target).then(() => { e.target.value = ''; }); } });
      box.addEventListener('click', e => { const b = e.target.closest('button[data-m]'); if (b) onMediaClick(k, b); });
    }
    $('fc').onclick = () => show(cur);
    $('fs').onclick = async () => {
      if (busy) return H.toast('انتظر حتى ينتهي رفع الصور');
      const o = {};
      for (const [k, l, t, req] of fields) {
        if (t === 'p' || t === 'i') {
          const mv = media[k];
          if (req && !(t === 'p' ? mv.length : mv)) return H.toast(`${l} مطلوب`);
          o[k] = t === 'p' ? mv : (mv || null);
          continue;
        }
        const el = $('f-' + k), s = t === 'c' ? el.checked : el.value.trim();
        if (req && !s) return H.toast(`${l} مطلوب`);
        o[k] = t === 'c' ? s : t === 'n' ? (s === '' ? null : Number(s)) : t === 'l' ? s.split('\n').map(z => z.trim()).filter(Boolean) : (s || null);
      }
      $('fs').disabled = true;
      const q = row && row.id ? sb.from(table).update(o).eq('id', row.id) : sb.from(table).insert(o);
      const { error } = await q;
      if (error) { console.error(error); $('fs').disabled = false; return H.toast('تعذّر الحفظ: ' + (error.message || '')); }
      H.toast('تم الحفظ');
      const keep = new Set();
      fields.forEach(([k, , t]) => { if (t === 'p') media[k].forEach(u => keep.add(u)); else if (t === 'i' && media[k]) keep.add(media[k]); });
      const old = []; Object.values(mOrig).forEach(v => (Array.isArray(v) ? v : [v]).forEach(u => { if (u) old.push(u); }));
      purge([...old, ...mUp].filter(u => !keep.has(u)));
      mUp = []; show(cur);
    };
  }

  $('go').onclick = async () => {
    $('lerr').textContent = '';
    const { error } = await sb.auth.signInWithPassword({ email: $('em').value.trim(), password: $('pw').value });
    if (error) { $('lerr').textContent = 'بيانات الدخول غير صحيحة'; return; }
    $('pw').value = ''; enter();
  };
  $('out').onclick = async () => { await sb.auth.signOut(); location.reload(); };
  $('list').addEventListener('change', e => { if (e.target.id === 'bulk') bulkUpload(e.target); });
  $('tabs').addEventListener('click', e => { const b = e.target.closest('button'); if (b) show(b.dataset.k); });
  $('list').addEventListener('click', async e => {
    const b = e.target.closest('button[data-a]'); if (!b) return;
    const r = rows[b.dataset.i], a = b.dataset.a, E2 = ENT[cur];
    if (a === 'new') return form(null, E2.form, cur);
    if (a === 'edit') return form(r, E2.form, cur);
    if (a.startsWith('st:')) { await upd(r.id, { status: a.slice(3) }); return badge(); }
    if (a === 'wa') return window.open(H.waLink(r.phone, `مرحبًا ${r.guest_name}، بخصوص طلب حجزك ${r.unit_name} من ${r.check_in}`), '_blank', 'noopener');
    if (a === 'del') {
      if (confirm('تأكيد الحذف نهائيًا؟')) {
        const urls = []; (E2.form || []).forEach(([k, , t]) => { if (t === 'p') (r[k] || []).forEach(u => urls.push(u)); else if (t === 'i' && r[k]) urls.push(r[k]); });
        const { error } = await sb.from(cur).delete().eq('id', r.id);
        if (error) H.toast('تعذّر الحذف'); else { H.toast('تم الحذف'); purge(urls); load(); }
      }
      return;
    }
  });
  try { await enter(); } catch (e) { console.error(e); $('login').hidden = false; }
  H.hideLoader();
});
</script>
</body>
</html>
